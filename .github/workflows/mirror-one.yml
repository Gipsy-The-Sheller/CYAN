name: mirror-one

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag"
        required: true
        default: "v2026.11.22"
      asset:
        description: "Exact GitHub asset name to mirror"
        required: true
        default: "orthofinder3-3.0.1b1-Linux-x64-v2026.11.22.tar.gz"
      max_bytes:
        description: "Split the converted file at this many bytes"
        required: false
        default: "47185920"

jobs:
  mirror-one:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install requests
      - name: Mirror one asset
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITEE_TAG: ${{ inputs.tag }}
          GITEE_REPO: ZJXMolls/CYAN
          GITEE_ONLY: ${{ inputs.asset }}
          GITEE_MAX_BYTES: ${{ inputs.max_bytes }}
        run: python scripts/sync_gitee_release.py
