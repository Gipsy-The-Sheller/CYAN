name: build

on:
  push:
    branches: [main]
    tags: ["v*", "[0-9]*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  windows-x64:
    name: Windows x64
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: msys2 {0}
    env:
      CYAN_ARCH: x64
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          cache: true
          install: >-
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            zip

      - name: Build
        run: bash scripts/build_all.sh

      - name: Smoke test
        run: bash scripts/smoke_all.sh

      - uses: actions/upload-artifact@v4
        with:
          name: cyan-windows-x64
          path: |
            dist/*.zip
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error

  windows-arm64:
    name: Windows arm64
    runs-on: windows-11-arm
    timeout-minutes: 60
    defaults:
      run:
        shell: msys2 {0}
    env:
      CYAN_ARCH: arm64
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: CLANGARM64
          update: true
          cache: true
          install: >-
            mingw-w64-clang-aarch64-toolchain
            mingw-w64-clang-aarch64-cmake
            mingw-w64-clang-aarch64-ninja
            zip

      - name: Build
        run: bash scripts/build_all.sh

      - name: Smoke test
        run: bash scripts/smoke_all.sh

      - uses: actions/upload-artifact@v4
        with:
          name: cyan-windows-arm64
          path: |
            dist/*.zip
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error

  linux-x64:
    name: Linux x64
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      CYAN_ARCH: x64
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config \
            autoconf automake libtool

      - name: Build
        run: bash scripts/build_all.sh

      - name: Smoke test
        run: bash scripts/smoke_all.sh

      - uses: actions/upload-artifact@v4
        with:
          name: cyan-linux-x64
          path: |
            dist/*.zip
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error

  linux-arm64:
    name: Linux arm64
    runs-on: ubuntu-22.04-arm
    timeout-minutes: 60
    env:
      CYAN_ARCH: arm64
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config \
            autoconf automake libtool

      - name: Build
        run: bash scripts/build_all.sh

      - name: Smoke test
        run: bash scripts/smoke_all.sh

      - uses: actions/upload-artifact@v4
        with:
          name: cyan-linux-arm64
          path: |
            dist/*.zip
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error

  macos-arm64:
    name: macOS arm64
    runs-on: macos-15
    timeout-minutes: 60
    env:
      CYAN_ARCH: arm64
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: brew install cmake ninja pkg-config

      - name: Build
        run: bash scripts/build_all.sh

      - name: Smoke test
        run: bash scripts/smoke_all.sh

      - uses: actions/upload-artifact@v4
        with:
          name: cyan-macos-arm64
          path: |
            dist/*.zip
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/')
    needs:
      - windows-x64
      - windows-arm64
      - linux-x64
      - linux-arm64
      - macos-arm64
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Assemble checksums
        run: |
          cd artifacts
          cat *.sha256 | sort -k2 > SHA256SUMS
          cat SHA256SUMS

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*.zip
            artifacts/*.tar.gz
            artifacts/SHA256SUMS
          generate_release_notes: true
