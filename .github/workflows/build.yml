name: build

on:
  push:
    branches: [main]
    tags: ["v*", "[0-9]*"]
  pull_request:
  workflow_dispatch:
    inputs:
      tools:
        description: "Tools to build (comma/space separated; empty = all)"
        required: false
        default: ""
      platform:
        description: "Target platform"
        type: choice
        options:
          - all
          - windows-x64
          - windows-arm64
          - linux-x64
          - linux-arm64
          - macos-arm64
        default: all

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  windows-x64:
    name: Windows x64
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.platform == 'all' || github.event.inputs.platform == 'windows-x64'
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: msys2 {0}
    env:
      CYAN_ARCH: x64
      CYAN_TOOLS: ${{ github.event.inputs.tools }}
      MSMPI_INC: C:\Program Files (x86)\Microsoft SDKs\MPI\Include
      MSMPI_LIB: C:\Program Files (x86)\Microsoft SDKs\MPI\Lib\x64
      MSMPI_BIN: C:\Program Files\Microsoft MPI\Bin
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          cache: true
          install: >-
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-zlib
            mingw-w64-x86_64-sqlite3
            bison
            flex
            make
            patch
            zip

      - name: Install Microsoft MPI SDK and runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $runtime = Join-Path $env:RUNNER_TEMP "msmpisetup.exe"
          $sdkMsi = Join-Path $env:RUNNER_TEMP "msmpisdk.msi"
          Invoke-WebRequest -Uri "https://github.com/microsoft/Microsoft-MPI/releases/download/v10.1.1/msmpisetup.exe" -OutFile $runtime
          Invoke-WebRequest -Uri "https://github.com/microsoft/Microsoft-MPI/releases/download/v10.1.1/msmpisdk.msi" -OutFile $sdkMsi
          $p = Start-Process $runtime -ArgumentList "-unattend" -Wait -PassThru
          if ($p.ExitCode -ne 0 -and $p.ExitCode -ne 3010) { throw "MS-MPI runtime install failed: $($p.ExitCode)" }
          $p = Start-Process msiexec.exe -ArgumentList "/i `"$sdkMsi`" /quiet /norestart" -Wait -PassThru
          if ($p.ExitCode -ne 0 -and $p.ExitCode -ne 3010) { throw "MS-MPI SDK install failed: $($p.ExitCode)" }
          if (!(Test-Path "C:\Program Files (x86)\Microsoft SDKs\MPI\Include\mpi.h")) { throw "MS-MPI SDK header missing" }
          if (!(Test-Path "C:\Program Files (x86)\Microsoft SDKs\MPI\Lib\x64\msmpi.lib")) { throw "MS-MPI SDK library missing" }
          if (!(Test-Path "C:\Program Files\Microsoft MPI\Bin\mpiexec.exe")) { throw "MS-MPI runtime missing" }

      - name: Build
        run: bash scripts/build_all.sh

      - name: Smoke test
        run: bash scripts/smoke_all.sh

      - uses: actions/upload-artifact@v4
        with:
          name: cyan-windows-x64
          path: |
            dist/*.zip
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: warn

  windows-x64-clang:
    name: Windows x64 (Clang)
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.platform == 'all' || github.event.inputs.platform == 'windows-x64'
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: msys2 {0}
    env:
      CYAN_ARCH: x64
      CYAN_TOOLS: iqtree3
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: CLANG64
          update: true
          cache: true
          install: >-
            mingw-w64-clang-x86_64-toolchain
            mingw-w64-clang-x86_64-cmake
            mingw-w64-clang-x86_64-ninja
            mingw-w64-clang-x86_64-zlib
            mingw-w64-clang-x86_64-sqlite3
            mingw-w64-clang-x86_64-boost
            mingw-w64-clang-x86_64-eigen3
            make
            patch
            zip

      - name: Build
        run: bash scripts/build_all.sh

      - name: Smoke test
        run: bash scripts/smoke_all.sh

      - uses: actions/upload-artifact@v4
        with:
          name: cyan-windows-x64-clang
          path: |
            dist/*.zip
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: warn

  windows-arm64:
    name: Windows arm64
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.platform == 'all' || github.event.inputs.platform == 'windows-arm64'
    runs-on: windows-11-arm
    timeout-minutes: 60
    defaults:
      run:
        shell: msys2 {0}
    env:
      CYAN_ARCH: arm64
      CYAN_TOOLS: ${{ github.event.inputs.tools }}
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: CLANGARM64
          update: true
          cache: true
          install: >-
            mingw-w64-clang-aarch64-toolchain
            mingw-w64-clang-aarch64-cmake
            mingw-w64-clang-aarch64-ninja
            mingw-w64-clang-aarch64-zlib
            mingw-w64-clang-aarch64-sqlite3
            bison
            flex
            patch
            zip

      - name: Build
        run: bash scripts/build_all.sh

      - name: Smoke test
        run: bash scripts/smoke_all.sh

      - uses: actions/upload-artifact@v4
        with:
          name: cyan-windows-arm64
          path: |
            dist/*.zip
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: warn

  linux-x64:
    name: Linux x64
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.platform == 'all' || github.event.inputs.platform == 'linux-x64'
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      CYAN_ARCH: x64
      CYAN_TOOLS: ${{ github.event.inputs.tools }}
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config bison flex \
            autoconf automake libtool openmpi-bin libopenmpi-dev \
            libeigen3-dev libboost-dev zlib1g-dev libsqlite3-dev

      - name: Build
        run: bash scripts/build_all.sh

      - name: Smoke test
        run: bash scripts/smoke_all.sh

      - uses: actions/upload-artifact@v4
        with:
          name: cyan-linux-x64
          path: |
            dist/*.zip
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: warn

  linux-arm64:
    name: Linux arm64
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.platform == 'all' || github.event.inputs.platform == 'linux-arm64'
    runs-on: ubuntu-22.04-arm
    timeout-minutes: 60
    env:
      CYAN_ARCH: arm64
      CYAN_TOOLS: ${{ github.event.inputs.tools }}
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config bison flex \
            autoconf automake libtool openmpi-bin libopenmpi-dev \
            libeigen3-dev libboost-dev zlib1g-dev libsqlite3-dev

      - name: Build
        run: bash scripts/build_all.sh

      - name: Smoke test
        run: bash scripts/smoke_all.sh

      - uses: actions/upload-artifact@v4
        with:
          name: cyan-linux-arm64
          path: |
            dist/*.zip
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: warn

  macos-arm64:
    name: macOS arm64
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.platform == 'all' || github.event.inputs.platform == 'macos-arm64'
    runs-on: macos-15
    timeout-minutes: 60
    env:
      CYAN_ARCH: arm64
      CYAN_TOOLS: ${{ github.event.inputs.tools }}
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: brew install cmake ninja pkg-config open-mpi eigen boost libomp bison flex

      - name: Build
        run: |
          export PATH="$(brew --prefix bison)/bin:$(brew --prefix flex)/bin:$PATH"
          bash scripts/build_all.sh

      - name: Smoke test
        run: bash scripts/smoke_all.sh

      - uses: actions/upload-artifact@v4
        with:
          name: cyan-macos-arm64
          path: |
            dist/*.zip
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: warn

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/') && (github.event_name != 'workflow_dispatch' || github.event.inputs.platform == 'all')
    needs:
      - windows-x64
      - windows-x64-clang
      - windows-arm64
      - linux-x64
      - linux-arm64
      - macos-arm64
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Assemble checksums
        run: |
          cd artifacts
          cat *.sha256 | sort -k2 > SHA256SUMS
          cat SHA256SUMS

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*.zip
            artifacts/*.tar.gz
            artifacts/SHA256SUMS
          generate_release_notes: true
